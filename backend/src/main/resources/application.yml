server:
  port: 8081

spring:
  application:
    name: feftms

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:falcon_energy_db}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# JWT Secrets and Expirations
application:
  cors:
    # Comma-separated browser origins. Configure deployed frontend origins through CORS_ALLOWED_ORIGINS.
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  security:
    jwt:
      secret-key: ${JWT_SECRET}
      expiration: 3600000 # 1 hour in ms
      refresh-token:
        expiration: 604800000 # 7 days in ms

  bootstrap:
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD}

logging:
  level:
    root: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
