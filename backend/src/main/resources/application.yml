server:
  port: 8081

spring:
  application:
    name: feftms

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:falcon_energy_db}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# JWT Secrets and Expirations
application:
  cors:
    # Comma-separated browser origins. Configure deployed frontend origins through CORS_ALLOWED_ORIGINS.
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  security:
    jwt:
      secret-key: ${JWT_SECRET}
      expiration: 3600000 # 1 hour in ms
      refresh-token:
        expiration: 604800000 # 7 days in ms

  bootstrap:
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD}

payments:
  flutterwave:
    client-id: ${FLUTTERWAVE_CLIENT_ID:}
    client-secret: ${FLUTTERWAVE_CLIENT_SECRET:}
    base-url: ${FLUTTERWAVE_BASE_URL:https://developersandbox-api.flutterwave.com}
    environment: ${FLUTTERWAVE_ENVIRONMENT:sandbox}
    # FLUTTERWAVE_WEBHOOK_SECRET is retained as a backwards-compatible local alias.
    webhook-secret-hash: ${FLUTTERWAVE_WEBHOOK_SECRET_HASH:${FLUTTERWAVE_WEBHOOK_SECRET:}}
    redirect-url: ${FLUTTERWAVE_REDIRECT_URL:}
    frontend-return-url: ${FLUTTERWAVE_FRONTEND_RETURN_URL:http://localhost:8080/customer/dashboard}
    scenario-key: ${FLUTTERWAVE_SCENARIO_KEY:}
    token-url: ${FLUTTERWAVE_TOKEN_URL:https://idp.flutterwave.com/realms/flutterwave/protocol/openid-connect/token}
    connect-timeout-seconds: ${FLUTTERWAVE_CONNECT_TIMEOUT_SECONDS:10}
    read-timeout-seconds: ${FLUTTERWAVE_READ_TIMEOUT_SECONDS:20}
  pawapay:
    api-token: ${PAWAPAY_API_TOKEN:}
    base-url: ${PAWAPAY_BASE_URL:}
    environment: ${PAWAPAY_ENVIRONMENT:}

routing:
  # Public OSRM endpoints are appropriate for light local testing only. Self-host or use a managed provider in production.
  base-url: ${ROUTING_BASE_URL:https://router.project-osrm.org}
  fallback-base-urls: ${ROUTING_FALLBACK_BASE_URLS:https://routing.openstreetmap.de/routed-car}
  allow-estimated-fallback: ${ROUTING_ALLOW_ESTIMATED_FALLBACK:true}
  timeout-seconds: ${ROUTING_TIMEOUT_SECONDS:12}

geocoding:
  open-meteo-base-url: ${GEOCODING_OPEN_METEO_BASE_URL:https://geocoding-api.open-meteo.com}
  nominatim-base-url: ${GEOCODING_NOMINATIM_BASE_URL:https://nominatim.openstreetmap.org}
  timeout-seconds: ${GEOCODING_TIMEOUT_SECONDS:5}

logging:
  level:
    root: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
